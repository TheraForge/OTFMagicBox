articles:
  - id: "no-code-health-app"
    imageName: "health-education-no-code"
    title:
      en: "Build a Health App in Under an Hour with No-Code"
      pt: "Crie uma aplicação de saúde em menos de uma hora sem código"
      ar: "أنشئ تطبيقًا صحيًا في أقل من ساعة دون برمجة"
    summary:
      en: "Learn how no-code tools can quickly turn a healthcare idea into a working app."
      pt: "Saiba como as ferramentas sem código podem transformar rapidamente uma ideia de saúde numa aplicação funcional."
      ar: "تعرّف على كيفية تحويل أدوات بلا برمجة فكرة للرعاية الصحية بسرعة إلى تطبيق عملي."
    url: "https://www.hippocratestech.com/build-a-health-app-in-under-an-hour-with-no-code/"

  - id: "type-2-diabetes"
    imageName: "health-education-diabetes"
    title:
      en: "Understanding Type 2 Diabetes"
      pt: "Compreender a Diabetes Tipo 2"
      ar: "فهم داء السكري من النوع الثاني"
    summary:
      en: "What it is, common signs, and everyday steps that support healthier living."
      pt: "O que é, sinais comuns e medidas diárias que ajudam a viver com mais saúde."
      ar: "ما هو، والعلامات الشائعة، والخطوات اليومية التي تدعم حياة أكثر صحة."
    url: "type-2-diabetes.html"

  - id: "asthma"
    imageName: "health-education-asthma"
    title:
      en: "Living Well with Asthma"
      pt: "Viver Bem com Asma"
      ar: "التعايش الجيد مع الربو"
    summary:
      en: "Learn about symptoms, common triggers, and practical ways to support asthma control."
      pt: "Saiba mais sobre os sintomas, os fatores desencadeantes comuns e formas práticas de ajudar a controlar a asma."
      ar: "تعرّف على الأعراض والمحفزات الشائعة وطرق عملية للمساعدة في السيطرة على الربو."
    url: "asthma.html"
