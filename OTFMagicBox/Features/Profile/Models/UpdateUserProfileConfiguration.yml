# Shown while editing the configured Health Profile. This feature accepts only
# self-reported values; it must not be described as GPS or precise-location collection.
healthProfilePrivacyNotice:
  en: "Optional self-reported location and health conditions help complete your profile. Provide only the minimum location detail needed; a country, city, or region is enough when a full address is not needed. This feature does not access GPS or precise device location. You can edit or clear these values at any time."
  pt: "A localização e as condições de saúde, indicadas opcionalmente por si, ajudam a completar o seu perfil. Indique apenas o detalhe de localização mínimo necessário; basta um país, cidade ou região quando não for necessária uma morada completa. Esta funcionalidade não acede a GPS nem à localização precisa do dispositivo. Pode editar ou limpar estes valores a qualquer momento."
  ar: "يساعد الموقع والحالات الصحية التي تبلغ عنها اختياريًا في استكمال ملفك الشخصي. قدّم الحد الأدنى من تفاصيل الموقع اللازمة؛ يكفي بلد أو مدينة أو منطقة عندما لا تكون هناك حاجة إلى عنوان كامل. لا تصل هذه الميزة إلى GPS أو الموقع الدقيق للجهاز. يمكنك تعديل هذه القيم أو مسحها في أي وقت."

