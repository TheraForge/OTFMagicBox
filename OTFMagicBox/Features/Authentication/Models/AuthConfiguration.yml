# Auth configuration
# ------------------
# This file controls the authentication and onboarding-related copy, options,
# and feature flags across the app's sign-up/sign-in flows.
# You can safely change the text values without touching the app code.
# Format:
#   - Localized strings are grouped by key with language codes (e.g., 'en', 'pt').
#   - You may add more languages by adding more codes (e.g., 'es', 'fr') with translations.
#   - Keep the structure flat (no deep nesting) to make it easy to edit.
#
# IMPORTANT
# - Do not remove required keys; if you don’t need a language, leave at least one (e.g., 'en').
# - Values on the right of the colon are the visible text in the app.
# - Lines starting with '#' are comments and are ignored by the app.

# Version of this YAML schema/content. Bump when you change copy/structure.
version: "2.3.0"

# Consent
# Consent configuration for the study/terms screen.
# Name of the consent resource/file (without extension if applicable).
consentFileName: "TheraForgeConsent"
# Localized reason statement shown to the user for consent.
consentReason:
  en: "I consent to participate in the study."
  pt: "Eu concordo em participar no estudo."
  ar: "أوافق على المشاركة في الدراسة."

# Consent
consentFileName: "TheraForgeConsent"

# Update this to fit login-time consent
consentReason:
  en: "I agree to the Terms of Use and acknowledge the Privacy Policy."
  pt: "Concordo com os Termos de Utilização e reconheço a Política de Privacidade."
  ar: "أوافق على شروط الاستخدام وأقرّ بسياسة الخصوصية."

# Title for the consent document
consentTitle:
  en: "Terms & Privacy Agreement"
  pt: "Acordo de Termos e Privacidade"
  ar: "اتفاقية الشروط والخصوصية"

# Ordered sections; toggle with `show`
consentSections:
  - type: "overview"
    show: true
    title:
      en: "Before You Continue"
      pt: "Antes de Continuar"
      ar: "قبل المتابعة"
    summary:
      en: "Review how we handle your data and agree to our terms."
      pt: "Revise como tratamos os seus dados e aceite os nossos termos."
      ar: "راجع كيف نتعامل مع بياناتك ووافق على شروطنا."
    content:
      en: "By continuing, you confirm you meet the minimum age, agree to the Terms of Use, and acknowledge the Privacy Policy. You can manage your choices in Settings at any time."
      pt: "Ao continuar, confirma que cumpre a idade mínima, concorda com os Termos de Utilização e reconhece a Política de Privacidade. Pode gerir as suas escolhas nas Definições a qualquer momento."
      ar: "بمتابعتك، تؤكد أنك تستوفي الحد الأدنى للعمر، وتوافق على شروط الاستخدام، وتقرّ بسياسة الخصوصية. يمكنك إدارة اختياراتك من الإعدادات في أي وقت."
    image:

  - type: "dataGathering"
    show: true
    title:
      en: "Data We Collect"
      pt: "Dados que Recolhemos"
      ar: "البيانات التي نجمعها"
    summary:
      en: "Account info, app usage, diagnostics, and optional health data."
      pt: "Informações de conta, utilização da app, diagnósticos e dados de saúde opcionais."
      ar: "معلومات الحساب، واستخدام التطبيق، وبيانات التشخيص، وبيانات صحية اختيارية."
    content:
      en: "We collect your account details (e.g., email), device identifiers, crash/diagnostic data, and app usage analytics. With your permission, we may read Health data to power app features. If you choose to complete the optional Health Profile, it collects only the self-reported location detail and health conditions you choose to type or select to complete your profile. Provide only the minimum location detail needed; a country, city, or region is enough when a full address is not needed. This feature does not request, access, or infer GPS or precise device location."
      pt: "Recolhemos dados da sua conta (ex.: email), identificadores do dispositivo, dados de falhas/diagnóstico e análises de utilização. Com a sua permissão, podemos ler dados de Saúde para funcionalidades da app. Se optar por preencher o Perfil de Saúde opcional, este recolhe apenas os detalhes de localização e as condições de saúde autodeclarados que escolher escrever ou selecionar para completar o seu perfil. Indique apenas o detalhe de localização mínimo necessário; basta um país, cidade ou região quando não for necessária uma morada completa. Esta funcionalidade não solicita, acede nem infere dados de GPS ou localização precisa do dispositivo."
      ar: "نجمع تفاصيل حسابك (مثل البريد الإلكتروني)، ومعرّفات الجهاز، وبيانات الأعطال/التشخيص، وتحليلات استخدام التطبيق. وبموافقتك، قد نقرأ بيانات الصحة لتمكين ميزات التطبيق. إذا اخترت إكمال الملف الصحي الاختياري، فإنه يجمع فقط تفاصيل الموقع والحالات الصحية التي تبلغ عنها بنفسك وتختار كتابتها أو تحديدها لإكمال ملفك الشخصي. قدّم الحد الأدنى من تفاصيل الموقع اللازمة؛ يكفي بلد أو مدينة أو منطقة عندما لا تكون هناك حاجة إلى عنوان كامل. لا تطلب هذه الميزة أو تصل إلى أو تستنتج بيانات GPS أو الموقع الدقيق للجهاز."
    image:

  - type: "privacy"
    show: true
    title:
      en: "Your Privacy & Security"
      pt: "A Sua Privacidade e Segurança"
      ar: "خصوصيتك وأمانك"
    summary:
      en: "Security and access controls are described in the Privacy Policy."
      pt: "Os controlos de segurança e de acesso são descritos na Política de Privacidade."
      ar: "تُوضَّح ضوابط الأمان وقيود الوصول في سياسة الخصوصية."
    content:
      en: "The Privacy Policy describes the security and access controls for account and Health Profile data. Privacy and security approval is required before the optional Health Profile is enabled."
      pt: "A Política de Privacidade descreve os controlos de segurança e de acesso para os dados da conta e do Perfil de Saúde. É necessária aprovação de privacidade e segurança antes de o Perfil de Saúde opcional ser ativado."
      ar: "توضّح سياسة الخصوصية ضوابط الأمان والوصول لبيانات الحساب والملف الصحي. يلزم الحصول على موافقة الخصوصية والأمان قبل تفعيل الملف الصحي الاختياري."
    image:

  - type: "dataUse"
    show: true
    title:
      en: "How We Use Your Data"
      pt: "Como Utilizamos os Seus Dados"
      ar: "كيف نستخدم بياناتك"
    summary:
      en: "To provide the service, improve reliability, and meet legal obligations."
      pt: "Para fornecer o serviço, melhorar a fiabilidade e cumprir obrigações legais."
      ar: "لتقديم الخدمة، وتحسين الموثوقية، والوفاء بالالتزامات القانونية."
    content:
      en: "We use data to deliver core functionality, troubleshoot issues, improve performance, and comply with laws. Aggregated analytics may inform product decisions. Marketing is optional and can be disabled."
      pt: "Utilizamos dados para fornecer funcionalidades essenciais, resolver problemas, melhorar o desempenho e cumprir a lei. Análises agregadas podem informar decisões do produto. Marketing é opcional e pode ser desativado."
      ar: "نستخدم البيانات لتقديم الوظائف الأساسية، وتشخيص المشكلات، وتحسين الأداء، والامتثال للقوانين. قد تُستخدم التحليلات المجمّعة لاتخاذ قرارات المنتج. التسويق اختياري ويمكن تعطيله."
    image:

  - type: "withdrawing"
    show: true
    title:
      en: "Your Choices"
      pt: "As Suas Escolhas"
      ar: "خياراتك"
    summary:
      en: "Edit or clear optional profile values, manage permissions, or request account deletion."
      pt: "Editar ou limpar valores opcionais do perfil, gerir permissões ou pedir a eliminação da conta."
      ar: "عدّل أو امسح قيم الملف الاختيارية، أو أدر الأذونات، أو اطلب حذف الحساب."
    content:
      en: "You can edit or clear optional Health Profile values in Manage Profile, revoke permissions in Settings, and request data export or account deletion. Retention and deletion, including any legal obligations, are governed by the Privacy Policy; a deletion request is not confirmation that processing has completed."
      pt: "Pode editar ou limpar valores opcionais do Perfil de Saúde em Gerir Perfil, revogar permissões nas Definições e pedir exportação dos dados ou eliminação da conta. A retenção e a eliminação, incluindo quaisquer obrigações legais, são regidas pela Política de Privacidade; um pedido de eliminação não confirma que o tratamento foi concluído."
      ar: "يمكنك تعديل قيم الملف الصحي الاختيارية أو مسحها من إدارة الملف الشخصي، وإلغاء الأذونات من الإعدادات، وطلب تصدير البيانات أو حذف الحساب. يخضع الاحتفاظ والحذف، بما في ذلك أي التزامات قانونية، لسياسة الخصوصية؛ ولا يؤكد طلب الحذف اكتمال المعالجة."
    image:

  - type: "custom"
    show: true
    title:
      en: "Links & Contact"
      pt: "Ligações e Contacto"
      ar: "الروابط والتواصل"
    summary:
      en: "Read the full Terms and Privacy Policy or contact support."
      pt: "Leia os Termos e a Política de Privacidade completos ou contacte o suporte."
      ar: "اقرأ الشروط وسياسة الخصوصية بالكامل أو تواصل مع الدعم."
    content:
      en: "Terms of Use: example.org/terms\nPrivacy Policy: example.org/privacy\nSupport: support@example.org"
      pt: "Termos de Utilização: example.org/terms\nPolítica de Privacidade: example.org/privacy\nApoio: support@example.org"
      ar: "شروط الاستخدام: example.org/terms\nسياسة الخصوصية: example.org/privacy\nالدعم: support@example.org"
    image: "online-agreement"

