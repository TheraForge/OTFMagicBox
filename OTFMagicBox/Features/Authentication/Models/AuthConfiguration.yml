# Passcode
# Optional in-app passcode shown after login.
# Enable the in-app passcode requirement.
passcodeEnabled: false
# Passcode length; allowed values are "4" or "6".
passcodeType: "4"   # "4" or "6"
# Localized prompt shown when asking for the passcode.
passcodePrompt:
  en: "Enter your passcode"
  pt: "Introduza o seu código"
  ar: "أدخل رمز المرور"

# Sign‑in options
# Informational text and icon for alternate sign-in methods.
# Informational text describing available sign-in methods.
loginOptionsText:
  en: "You can sign in to your cloud account with username and password. Alternatively, you can sign in with your Apple ID or with your Gmail address."
  pt: "Pode iniciar sessão na conta na nuvem com nome de utilizador e palavra‑passe. Em alternativa, utilize Apple ID ou Gmail."
  ar: "يمكنك تسجيل الدخول إلى حسابك السحابي باستخدام اسم المستخدم وكلمة المرور. بدلاً من ذلك، يمكنك تسجيل الدخول باستخدام Apple ID أو عنوان Gmail."
# SF Symbol name for the sign-in options icon.
loginOptionsIcon: "cloud"

